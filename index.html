<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Hub</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Home Hub">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<style>
  :root { --bg:#f6f4ef; --ink:#1f2328; --muted:#6b6f76; --accent:#2f6f5e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141619; --ink:#e8e6e3; --muted:#9aa0a6; --accent:#6fc3a8; } }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:6px; padding:24px; box-sizing:border-box; text-align:center; background:var(--bg); color:var(--ink);
         font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  img { width:96px; height:96px; border-radius:22px; margin-bottom:10px; }
  h1 { font-size:20px; margin:0; }
  p { color:var(--muted); font-size:15px; margin:4px 0; max-width:340px; line-height:1.45; }
  a { color:var(--accent); font-weight:600; }
  .steps { display:none; margin-top:14px; }
</style>
</head>
<body>
  <img src="icon-192.png" alt="">
  <h1>Home Hub</h1>
  <p id="status">Opening…</p>
  <p><a id="go" href="#">Tap here if it doesn't open</a></p>
  <div class="steps" id="steps">
    <p><b>iPhone (Safari):</b> tap Share, then <b>Add to Home Screen</b>.</p>
    <p><b>Android (Chrome):</b> tap ⋮, then <b>Add to Home screen</b>.</p>
    <p>Then open Home Hub from the new icon.</p>
  </div>
<script>
  // The deployed Apps Script web app URL (Deploy > Manage deployments > Web app URL).
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxrG7qGB2xAMEFWaNpqd9XtrW2WREyzcGHTEds5ydmelNr6frhljT32w19eCI3ulBMm/exec';

  const ready = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(APP_URL);
  const addMode = new URLSearchParams(location.search).has('add');
  const go = document.getElementById('go');

  if (!ready) {
    document.getElementById('status').textContent = 'This launcher isn\'t connected to the app yet.';
    go.style.display = 'none';
  } else if (addMode) {
    // Setup mode: stay on this page so it can be added to the home screen.
    // Strip "?add" so the saved icon opens the plain launcher, which forwards to the app.
    history.replaceState(null, '', location.pathname);
    document.getElementById('status').textContent = 'Add this page to your home screen:';
    document.getElementById('steps').style.display = 'block';
    go.textContent = 'Or open Home Hub now';
    go.href = APP_URL;
  } else {
    go.href = APP_URL;
    location.replace(APP_URL);
  }
</script>
</body>
</html>
